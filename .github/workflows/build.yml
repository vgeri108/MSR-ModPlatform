name: Build ModLoader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MinesweeperModLoader
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MineRebornModLoader/ModLoader/MinesweeperModLoader.csproj

      - name: Build
        run: dotnet build MineRebornModLoader/ModLoader/MinesweeperModLoader.csproj --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinesweeperModLoader
          path: |
            MineRebornModLoader/ModLoader/bin/Release/net10.0/
            MineRebornModLoader/MinesweeperModAPI/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 14
